name: dobare

services:
  # ─── دیتابیس PostgreSQL ───
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dobare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?متغیر POSTGRES_PASSWORD در .env لازم است}
      POSTGRES_DB: ${POSTGRES_DB:-dobare}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dobare} -d ${POSTGRES_DB:-dobare}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # عمداً پورتی به بیرون باز نمی‌شود — فقط داخل شبکه‌ی داکر در دسترس است

  # ─── مایگریشن اسکیما (یک‌بار اجرا می‌شود و تمام) ───
  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?متغیر DATABASE_URL در .env لازم است}
    depends_on:
      postgres:
        condition: service_healthy

  # ─── اپلیکیشن دوباره ───
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?متغیر DATABASE_URL در .env لازم است}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?متغیر ADMIN_PASSWORD در .env لازم است}
      RESERVATION_HOURS: ${RESERVATION_HOURS:-6}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SELLER_PHONE: ${SELLER_PHONE:-}
      SELLER_TELEGRAM: ${SELLER_TELEGRAM:-}
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── وب‌سرور Caddy: SSL خودکار + پروکسی معکوس ───
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?متغیر DOMAIN در .env لازم است}
      ACME_EMAIL: ${ACME_EMAIL:?متغیر ACME_EMAIL در .env لازم است}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      - app
